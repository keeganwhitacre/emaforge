<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sample check-in · EMA Forge</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/public-theme.js?v=20261120"></script>
  <link rel="stylesheet" href="css/surfaces.css?v=20261124c">
  <link rel="stylesheet" href="css/participant-stage.css?v=20261125">
</head>
<body class="participant-sample">
<main class="participant-stage" aria-label="Sample check-in">
  <header class="participant-stage-toolbar">
    <a class="participant-stage-control" href="index.html" aria-label="Back to EMA Forge home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> Home
    </a>
    <select class="participant-stage-select" id="sample-mode" aria-label="Sample session">
      <option value="survey">Sample survey</option>
      <option value="physiology">Survey + heart rate</option>
    </select>
    <button class="participant-stage-control" id="sample-reset" type="button" title="Restart sample" aria-label="Restart sample">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 1 2.7 6.4M3 5v7h7"/></svg>
    </button>
    <p class="participant-stage-note" id="sample-note">Sample only · Answers aren’t saved</p>
  </header>
  <div class="participant-stage-canvas">
    <div class="participant-stage-screen">
      <iframe id="sample-frame" title="Sample participant check-in" sandbox="allow-scripts" hidden></iframe>
    </div>
    <p class="participant-stage-status" id="sample-status" role="status">Loading sample…</p>
  </div>
</main>
<script src="js/state.js?v=20260924b"></script>
<script src="js/export.js?v=20261125e"></script>
<script src="js/sample.js?v=20261125e"></script>
</body>
</html>
