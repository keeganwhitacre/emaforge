<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="css/surfaces.css?v=20261124c">
  <style>
    body { margin: 0; background: var(--bg); color: var(--fg); font-size: 16px; }
    main { max-width: 440px; margin: 0 auto; padding: 40px 18px 56px; text-align: center; }
    h1 { margin: 0 0 8px; font-family: var(--font-display); font-size: clamp(30px, 6vw, 40px); font-weight: 700; letter-spacing: -.035em; line-height: 1.08; }
    p { color: var(--fg-2); line-height: 1.5; margin: 0 0 20px; font-size: 16px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { color: var(--accent-hover); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 16px; margin-bottom: 24px; }
    /* Sample switcher as a segmented control */
    .sample-modes { display: inline-flex; flex-wrap: wrap; }
    iframe[hidden], #sample-status:empty, .sample-phone:has(iframe[hidden]) { display: none; }
    /* Phone frame: outer radius 52 with a 9px bezel leaves a 43px screen radius. */
    .sample-phone { margin: 0 auto; max-width: 400px; padding: 9px; border-radius: 52px; background: #1b1d20; box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 30px 60px rgba(20, 28, 40, .22), 0 6px 14px rgba(20, 28, 40, .14); animation: forge-sheet-in var(--dur-slow) var(--ease-spring) both; }
    iframe { display: block; border: 0; width: 100%; height: min(760px, max(520px, 76dvh)); border-radius: 43px; background: #000; }
  </style>

<main>
  <h1>Try a sample check-in</h1>
  <p>See what a participant sees. Try a mood rating, a follow-up that depends on your answer, and an optional reflection. The heart-rate demo uses simulated data. Your answers stay in this demo.</p>
  <div class="actions">
    <div class="sample-modes forge-segments" role="group" aria-label="Sample sessions">
    <button type="button" id="sample-survey" aria-pressed="true">Survey</button>
    <button type="button" id="sample-physiology" aria-pressed="false">Survey + heart rate</button>
    </div>
    <a href="builder.html">Build a study</a>
  </div>
  <p id="sample-status" role="status">Loading sample…</p>
  <div class="sample-phone"><iframe id="sample-frame" title="Sample participant check-in" sandbox="allow-scripts" hidden></iframe></div>
</main>
