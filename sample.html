<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample check-in · EMA Forge</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; background: #f3f4f6; color: #22262b; font: 16px system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 18px; }
    h1 { font-size: 1.65rem; margin: 12px 0 6px; }
    p { line-height: 1.5; margin: 6px 0 14px; }
    a { color: #8d382f; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
    button { font: inherit; color: inherit; background: white; border: 1px solid #9a9da0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button[aria-pressed="true"] { color: #fff; background: #292c30; border-color: #292c30; }
    iframe[hidden] { display: none; }
    iframe { display: block; border: 0; width: 100%; height: min(690px, max(500px, 74dvh)); border-radius: 14px; background: #000; }
  </style>
</head>
<body>
<main>
  <a href="index.html">EMA Forge</a>
  <h1>Try a sample check-in</h1>
  <p>See what a participant sees. The camera example is simulated and your answers stay in this demo.</p>
  <div class="actions" aria-label="Sample sessions">
    <button type="button" id="sample-survey" aria-pressed="true">Survey</button>
    <button type="button" id="sample-physiology" aria-pressed="false">Survey + heart rate</button>
    <a href="builder.html">Build a study</a>
  </div>
  <p id="sample-status" role="status">Loading sample…</p>
  <iframe id="sample-frame" title="Sample participant check-in" sandbox="allow-scripts" hidden></iframe>
</main>
<script src="js/state.js?v=20260924b"></script>
<script src="js/export.js?v=20261120"></script>

</html>
