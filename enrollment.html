</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><img src="favicon.svg" width="27" height="27" alt=""> EMA Forge</a>
    <a href="quickstart.html">First-study guide</a>
  </header>
  <main class="enrollment-guide">
    <div class="intro">
      <h1>Enrollment checklist</h1>
      <p>Use this with your study team before sending your first participant link.</p>
      <div class="intro-actions">
        <a href="quickstart.html#pilot">Back to the phone pilot</a>
      </div>
    </div>

    <section aria-labelledby="protocol-heading">
      <h2 id="protocol-heading">Confirm the study is ready</h2>
      <ul class="enrollment-checklist">
        <li><label><input type="checkbox"><span><strong>Review your approvals and data plan.</strong> Confirm with your institution that you have the required approvals for the protocol, consent process, and hosting and storage setup. Agree on who can access data, where exports go, and when records are deleted.</span></label></li>
        <li><label><input type="checkbox"><span><strong>Install your final study file.</strong> Replace the practice consent with the approved language. Check the questions, schedule, and any branching or optional measures. Download the updated study file from Builder and install it in Study Admin.</span></label></li>
      </ul>
    </section>

    <section aria-labelledby="pilot-check-heading">
      <h2 id="pilot-check-heading">Test the installed version</h2>
      <ul class="enrollment-checklist">
        <li><label><input type="checkbox"><span><strong>Run a fresh staff pilot.</strong> Use sample answers on a phone and browser your participants will use. Check consent, each key session and branch, and any camera or location prompts your study uses.</span></label></li>
        <li><label><input type="checkbox"><span><strong>Verify receipt and review your export process.</strong> Refresh Study Admin and look for <strong>Pilot verified</strong>. Confirm your team knows how to find responses and download exports. Pilot responses stay out of research exports.</span></label></li>
      </ul>
    </section>

    <section aria-labelledby="links-heading">
      <h2 id="links-heading">Get participant links ready</h2>
      <ul class="enrollment-checklist">
        <li><label><input type="checkbox"><span><strong>Save the roster and check the delivery plan.</strong> In <strong>Participants &amp; delivery</strong>, use study IDs without names or contact details in the IDs. If using SMS, send a test message and verify the schedule and time zones.</span></label></li>
        <li><label><input type="checkbox"><span><strong>Create participant links.</strong> Check each link against the intended study ID and session before sharing. Use your approved contact method.</span></label></li>
      </ul>
      <p class="reference"><a href="readme.html#routing">Participant link instructions</a> · <a href="readme.html#twilio-integration">Optional SMS setup</a></p>
    </section>
  </main>
</body>
</html>
